<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>介面使用點白板</title>
<meta name="theme-color" content="#F2E52A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF9EC;--ink:#26270F;--muted:#5C5E45;--accent:#F2E52A;--accent-ink:#1C6E36;--ok:#0C5E34;--warn:#6E4000;--line:rgba(38,39,15,.14);--glass:rgba(255,255,255,.62)}
*{box-sizing:border-box}
html{scroll-padding-top:84px}
body{margin:0;color:var(--ink);font-family:'Noto Sans TC','PingFang TC',-apple-system,sans-serif;font-size:15px;line-height:1.7;
  background:radial-gradient(900px 600px at 90% -10%,rgba(242,229,42,.40),transparent 60%),var(--bg);background-attachment:fixed;padding:0 max(16px,3vw) 64px}

.mono{font-family:inherit}
header{max-width:1240px;margin:20px auto 0;padding:32px clamp(20px,4vw,40px);background:var(--accent);border-radius:28px}
header .eb,header .legend,header .legend span{color:#3A3C1C}
.eb{font-family:inherit;font-size:13px;letter-spacing:.02em;color:var(--muted);}
h1{font-size:clamp(26px,4vw,40px);letter-spacing:.01em;margin:8px 0 6px;line-height:1.35;text-wrap:balance}
header p{color:#3A3C1C;margin:0;max-width:60em}
nav{position:sticky;top:8px;z-index:5;max-width:1240px;margin:16px auto 0;display:flex;flex-wrap:nowrap;overflow-x:auto;gap:4px;padding:6px;border-radius:999px;background:var(--glass);backdrop-filter:saturate(160%) blur(16px);-webkit-backdrop-filter:saturate(160%) blur(16px);border:1px solid rgba(255,255,255,.8)}
nav a{flex:none;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:600;font-size:13px}
nav a:hover{background:var(--accent);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:3px;border-radius:6px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px;font-size:12px;color:var(--muted)}
.chip{font-family:inherit;font-size:13px;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.ok{background:rgba(20,128,74,.14);color:var(--ok)}
.chip.fix{background:rgba(242,229,42,.40);color:var(--accent-ink)}
.chip.todo{background:rgba(154,91,0,.14);color:var(--warn)}
.board{max-width:1240px;margin:40px auto 0;display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:28px;align-items:start}
@media (max-width:860px){.board{grid-template-columns:1fr}}
.board > h2{grid-column:1/-1;margin:0;font-size:22px;letter-spacing:0;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.board > h2 small{font-family:inherit;font-size:13px;color:var(--muted);font-weight:500}
.board > p{grid-column:1/-1;margin:-18px 0 0;color:var(--muted)}
/* 線框 */
.wire{background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:6px 6px 0 rgba(38,39,15,.08);position:sticky;top:76px}
@media (max-width:860px){.wire{position:static}}
.blk{position:relative;border:1.5px dashed rgba(38,39,15,.45);border-radius:8px;padding:8px 10px 8px 34px;min-height:40px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.blk.fill{background:var(--ink);color:#fff;border-style:solid}
.blk.acc{background:var(--accent);border:1.5px solid var(--accent);color:#111}
.blk span{font-weight:500;color:var(--muted);font-size:13px}
.blk.fill span{color:rgba(255,255,255,.85)}.blk.acc span{color:#111}
.rowb{display:grid;gap:8px}
.pin{position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--accent);color:#111;font-family:inherit;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
/* 便利貼 */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.note{background:var(--glass);backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);border:1px solid rgba(255,255,255,.85);border-radius:12px;padding:12px 14px;box-shadow:0 10px 24px -16px rgba(38,39,15,.35)}
.note h3{margin:0 0 6px;font-size:14px;display:flex;gap:8px;align-items:center}
.note h3 i{font-style:normal;flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);font-family:inherit;font-size:13px;font-weight:700;display:grid;place-items:center}
.note dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:12.5px}
.note dt{color:var(--muted);font-family:inherit;font-size:13px;padding-top:2px;white-space:nowrap}
.note dd{margin:0;min-width:0}
.sum{max-width:1240px;margin:48px auto 0;border-top:1px solid var(--line);padding-top:20px}
.sum h2{font-size:18px;margin:0 0 10px}
.sum ul{margin:0;padding-left:1.2em;columns:2 320px;column-gap:32px}
.sum li{break-inside:avoid;margin-bottom:6px}
</style>
</head>
<body>
<header>
  <div class="eb">UX Whiteboard · Web Interface Guidelines 檢查</div>
  <h1>介面使用點白板</h1>
  <p>逐一列出 8 個畫面的使用點：使用者在這裡做什麼、目的、鍵盤與觸控操作方式，以及依 Vercel Web Interface Guidelines 檢查後的狀態。左側為畫面線框，數字對應右側便利貼。</p>
  <div class="legend"><span><span class="chip ok">通過</span> 檢查無問題</span><span><span class="chip fix">已修正</span> 這次檢查後已改</span><span><span class="chip todo">待改善</span> 尚未處理</span></div>
</header>
<nav id="toc" aria-label="畫面目錄"></nav>
<main id="boards"></main>
<section class="sum" id="summary"></section>
<script>

 { id:'study', name:'單字卡複習', path:'#/study', intro:'一次一張卡，先自評再看答案。操作最頻繁的畫面，以鍵盤和單手操作為優先。',

   notes:[
    [1,'進度','知道本輪剩多少','純顯示','ok','寬度變化使用 transition，尊重減少動態設定'],
    [2,'單字','回想意思','自動朗讀一次，可關閉','fix','新增「自動發音：開／關」切換，設定會記住'],
    [3,'發音','重聽','按鈕','ok',''],
    [4,'自評三選一','誠實標記記憶程度','按鈕 44px；鍵盤 1 2 3','ok','顏色之外另有文字標籤，不只靠顏色'],
    [5,'答案區','核對中文與例句','例句可發音','ok',''],
    [6,'下一個','套用排程並換卡','Enter 或空白鍵；自動聚焦','ok','不認識的字本輪最後再出現一次'],
    [7,'其實記錯了','把「認識」改判為不認識','按鈕','ok','避免高估，提供反悔路徑'],
   ]},
 { id:'words', name:'單字本', path:'#/words', intro:'管理全部單字：新增、搜尋、分類、刪除。',
   wire:[['rowb4','各分類字數｜已學會','',1],['fill','開始背（N）','',2],['','每日新字數','數字輸入',3],['','新增單字表單','英／中／詞性／例句／分類',4],['','分類篩選＋搜尋','',5],['','單字清單','發音・刪除',6]],
   notes:[
    [1,'分類統計','看各來源字數','純顯示','ok',''],
    [2,'開始背','進入單字卡','連結','ok',''],
    [3,'每日新字','調整每天新字上限 0–50','數字欄位','fix','補上 name、inputmode、autocomplete'],
    [4,'新增單字','手動加入生字','表單；必填英文、中文','fix','補上範例 placeholder（以 … 結尾）、關閉英文欄拼字檢查'],
    [5,'篩選與搜尋','縮小清單','按鈕＋搜尋欄','fix','搜尋欄補上無障礙標籤；篩選與搜尋寫進網址，重新整理或分享連結都會保留'],

   notes:[

    [2,'倒數計時','掌握剩餘時間','等寬數字，不會跳動','ok','超時後顯示 + 並繼續計時'],
    [3,'交卷','結束作答','有未答題會先確認','fix','作答中關閉分頁會跳出離開警告'],
    [4,'選項','選擇答案，可改答','按鈕 44px；選中為黑底','fix','加上 aria-pressed 表示選取狀態'],
    [5,'先跳過','標記並跳到下一題未答題','按鈕','fix','觸控高度由 36 加大到 44px；捲動動畫尊重減少動態設定'],
    [6,'點字查詢','加入單字本、發音、查劍橋','底部浮動列','fix','手機上不再自動彈出鍵盤；輸入欄補上標籤'],
    [7,'題號導覽','跳到指定題；看哪些已答、已標記','按鈕 44px','ok','已答＝黑底，跳過＝橘色底線'],
   ],
   extra:'<span class="chip fix">已修正</span> 手機版新增「文章／題目」切換鈕，不必來回捲動；點題號會自動切到題目。'},
 { id:'result', name:'交卷解析', path:'#/read/:id（交卷後）', intro:'同一畫面顯示結果。目標是每一題都知道錯在哪、花了多久。',
   wire:[['acc','得分＋總用時＋是否超時','',1],['','文章：出處句綠色標示','',2],['','每題：正解／你的答案／用時','',3],['','解析文字','',4],['','錯誤原因（複選）','',5],['','檢討筆記','',6],['fill','儲存到錯題本','',7]],

    [5,'錯誤原因','分類自己的錯誤','7 個可複選標籤','fix','觸控高度加大到 44px；超時錯題會預先勾選「時間不夠」'],

 { id:'review', name:'錯題本', path:'#/review', intro:'彙整所有作答紀錄：錯在哪一類、時間花在哪、成績走勢。',

   notes:[
    [1,'總覽數據','掌握整體狀況','純顯示','ok','無資料時顯示 0，不會壞版'],

const labels = { ok:'通過', fix:'已修正', todo:'待改善' };
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
document.getElementById('toc').innerHTML = SCREENS.map(s => `<a href="#${s.id}">${s.name}</a>`).join('');
document.getElementById('boards').innerHTML = SCREENS.map(s => `
  <section class="board" id="${s.id}">
    <h2>${s.name} <small>${esc(s.path)}</small></h2>
    <p>${s.intro}${s.extra ? '　' + s.extra : ''}</p>
    <div class="wire" role="img" aria-label="${s.name} 線框圖">${s.wire.map(([cls, t, sub, pin]) =>
      `<div class="blk ${cls.startsWith('rowb') ? '' : cls}">${pin ? `<b class="pin">${pin}</b>` : ''}${esc(t)}${sub ? ` <span>${esc(sub)}</span>` : ''}</div>`).join('')}</div>
    <div class="notes">${s.notes.map(([n, title, goal, how, st, check]) => `
      <article class="note"><h3><i>${n}</i>${title}</h3>
        <dl><dt>目的</dt><dd>${goal}</dd><dt>操作</dt><dd>${esc(how)}</dd>
        <dt>檢查</dt><dd><span class="chip ${st}">${labels[st]}</span> ${check}</dd></dl></article>`).join('')}</div>
  </section>`).join('');
const all = SCREENS.flatMap(s => s.notes), count = k => all.filter(n => n[4] === k).length;
document.getElementById('summary').innerHTML = `<h2>總結：${all.length} 個使用點 · 通過 ${count('ok')} · 已修正 ${count('fix')} · 待改善 ${count('todo')}</h2>
<ul>
<li><b>未涵蓋</b>：確認視窗仍使用瀏覽器原生對話框</li>
<li><b>未實測</b>：AI 助理的「停止」需要 API 金鑰才能實際驗證</li>
<li><b>字體</b>：全站改用思源黑體（Noto Sans TC），內文 17px、行高 1.75，最小字級 13px</li>
</ul>`;
</script>
</body>
</html>
